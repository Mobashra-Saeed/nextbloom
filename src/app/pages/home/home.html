<div class="relative w-full bg-[var(--bg-transparent)] select-none overflow-x-hidden">

    <!-- ================= 1. HERO TYPOGRAPHY & ACTIONS (Viewport 1) ================= -->
    <!-- UPDATED: min-h-[65vh] for mobile, lg:min-h-[85vh] for desktop. Added py-16 for mobile breathing room -->
    <section
        class="relative z-10 w-full min-h-[65vh] lg:min-h-[85vh] flex flex-col items-center justify-center text-center px-4 sm:px-6 py-16 lg:py-0">

        <!-- Ambient Floating Magical Stars -->
        <div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
            <svg class="absolute top-[10%] lg:top-[15%] left-[5%] lg:left-[12%] w-5 h-5 lg:w-7 lg:h-7 text-[var(--brand-pink)]/50 animate-pulse"
                fill="currentColor" viewBox="0 0 24 24">
                <path
                    d="M12 2C12 7.52 16.48 12 22 12C16.48 12 12 16.48 12 22C12 16.48 7.52 12 2 12C7.52 12 12 7.52 12 2Z" />
            </svg>
            <svg class="absolute bottom-[15%] lg:bottom-[20%] left-[10%] lg:left-[20%] w-4 h-4 lg:w-6 lg:h-6 text-[var(--brand-pink-dark)]/40 animate-pulse delay-300"
                fill="currentColor" viewBox="0 0 24 24">
                <path
                    d="M12 2C12 7.52 16.48 12 22 12C16.48 12 12 16.48 12 22C12 16.48 7.52 12 2 12C7.52 12 12 7.52 12 2Z" />
            </svg>
            <svg class="absolute top-[20%] lg:top-[25%] right-[5%] lg:right-[15%] w-3 h-3 lg:w-5 lg:h-5 text-[var(--brand-pink)]/60 animate-pulse delay-700"
                fill="currentColor" viewBox="0 0 24 24">
                <path
                    d="M12 2C12 7.52 16.48 12 22 12C16.48 12 12 16.48 12 22C12 16.48 7.52 12 2 12C7.52 12 12 7.52 12 2Z" />
            </svg>
        </div>

        <div class="max-w-3xl mx-auto flex flex-col items-center relative z-10 w-full">

            <!-- Magical Overline Text -->
            <div class="flex items-center gap-2 lg:gap-3 opacity-0 animate-fade-in-up">
                <div class="w-6 lg:w-8 h-[1px] bg-[var(--brand-pink)]"></div>
                <span
                    class="text-[9px] sm:text-[10px] md:text-xs uppercase tracking-[0.2em] text-[var(--text-taupe)]/90 font-medium">
                    We Craft Details That Inspire
                </span>
                <div class="w-6 lg:w-8 h-[1px] bg-[var(--brand-pink)] hidden md:block"></div>
            </div>

            <!-- Dreamy Gradient Main Title -->
            <div class="relative mt-4 lg:mt-6">
                <svg class="absolute -top-4 -left-6 w-4 h-4 text-[var(--brand-pink-dark)]/70 animate-bounce delay-150 pointer-events-none hidden md:block"
                    fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M12 2C12 7.52 16.48 12 22 12C16.48 12 12 16.48 12 22C12 16.48 7.52 12 2 12C7.52 12 12 7.52 12 2Z" />
                </svg>

                <h2
                    class="font-serif flex flex-col md:flex-row items-center justify-center gap-2 md:gap-4 text-4xl sm:text-5xl md:text-[4rem] drop-shadow-sm tracking-wide leading-[1.1] md:leading-[1.2] opacity-0 animate-fade-in-up delay-100">
                    <span
                        class="text-transparent bg-clip-text bg-gradient-to-r from-[var(--brand-pink-dark)] to-[var(--text-taupe)] text-center px-2">
                        Timeless <br class="md:hidden"> Accessories
                    </span>
                    <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="currentColor"
                        class="w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 text-[var(--brand-pink-dark)] flex-shrink-0 overflow-visible cursor-pointer relative z-10 mt-2 md:mt-0">
                        <style>
                            .pearl-drape {
                                transform-origin: center top;
                                animation: gentle-swing 4s ease-in-out infinite;
                                filter: drop-shadow(0px 4px 3px rgba(0, 0, 0, 0.1));
                                transition: all 0.4s ease;
                            }

                            svg:hover .pearl-drape {
                                animation: gentle-swing-hover 2s ease-in-out infinite;
                                filter: drop-shadow(0px 0px 10px currentColor);
                            }

                            @keyframes gentle-swing {

                                0%,
                                100% {
                                    transform: rotate(-2deg) translateY(0px);
                                }

                                50% {
                                    transform: rotate(2deg) translateY(-3px);
                                }
                            }

                            @keyframes gentle-swing-hover {

                                0%,
                                100% {
                                    transform: scale(1.05) rotate(-3deg) translateY(-2px);
                                }

                                50% {
                                    transform: scale(1.05) rotate(3deg) translateY(-6px);
                                }
                            }
                        </style>
                        <g class="pearl-drape">
                            <circle cx="1.5" cy="6" r="2.8" />
                            <circle cx="22.5" cy="6" r="2.8" />
                            <circle cx="3" cy="11.5" r="3.0" />
                            <circle cx="21" cy="11.5" r="3.0" />
                            <circle cx="6.8" cy="16.5" r="3.2" />
                            <circle cx="17.2" cy="16.5" r="3.2" />
                            <circle cx="12" cy="19" r="3.5" />
                        </g>
                    </svg>
                </h2>

                <svg class="absolute -bottom-2 -right-8 w-5 h-5 text-[var(--brand-pink-dark)]/60 animate-pulse delay-300 pointer-events-none hidden md:block"
                    fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M12 2C12 7.52 16.48 12 22 12C16.48 12 12 16.48 12 22C12 16.48 7.52 12 2 12C7.52 12 12 7.52 12 2Z" />
                </svg>
            </div>

            <!-- BUTTONS -->
            <!-- UPDATED: Adjusted mobile margins (mt-8 lg:mt-12) and made buttons take full width (w-full sm:w-auto) on small screens -->
            <div
                class="relative z-20 flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-4 px-2 w-full max-w-sm sm:max-w-none mx-auto mt-8 lg:mt-12 opacity-0 animate-fade-in-up delay-200">

                <button (click)="scrollToShop()"
                    class="w-full sm:w-auto flex items-center justify-center gap-2 bg-[var(--brand-pink-dark)] text-[var(--surface-white)] border border-[var(--brand-pink-dark)] font-semibold text-[10px] sm:text-xs md:text-sm uppercase tracking-wider px-6 sm:px-8 py-3.5 sm:py-3.5 rounded-full transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_15px_25px_rgba(232,122,144,0.4)] cursor-pointer">
                    Shop Collection
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
                        class="w-4 h-4 sm:w-5 sm:h-5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007z" />
                    </svg>
                </button>

                <a
                    href="https://wa.me/923486527505?text=Hi%20NextBloom!%20I%20would%20like%20to%20discuss%20a%20custom%20jewelry%20order."
                    target="_blank" rel="noopener noreferrer"
                    class="w-full sm:w-auto flex items-center justify-center gap-2 bg-transparent text-[var(--brand-pink-dark)] border-[1.5px] border-[var(--brand-pink-dark)] font-semibold text-[10px] sm:text-xs md:text-sm uppercase tracking-wider px-6 sm:px-8 py-3.5 sm:py-3.5 rounded-full transition-all duration-300 hover:-translate-y-1 hover:bg-[var(--brand-pink-dark)]/5 cursor-pointer">
                    Custom Orders
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
                        class="w-4 h-4 sm:w-5 sm:h-5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
                    </svg>
                    </a>
                
            </div>

        </div>
    </section>

    <!-- ================= 2. IMAGE SLIDER SECTION (Viewport 2) ================= -->
    <!-- UPDATED: Adjusted margins for mobile (mt-8 mb-16) vs desktop (lg:mt-24 lg:mb-24) -->
    <section
        class="relative z-10 w-[95%] max-w-6xl mx-auto h-[55vh] sm:h-[60vh] lg:h-[85vh] flex items-center justify-center overflow-hidden bg-[var(--bg-slider)] opacity-0 animate-fade-in-up delay-300 rounded-2xl md:rounded-[1.5rem] shadow-[0_20px_50px_-10px_rgba(232,122,144,0.2)] border-[3px] border-[var(--surface-white)]/60 mt-10 lg:mt-24 mb-16 lg:mb-24">

        <!-- Layer 1: Image Slider -->
        @for (img of sliderImages; track img; let idx = $index) {
        <div class="absolute inset-0 w-full h-full transition-opacity duration-1000 ease-in-out"
            [class.opacity-100]="idx === currentIndex" [class.opacity-0]="idx !== currentIndex">
            <img [src]="img" alt="Nextbloom Collection" class="w-full h-full object-cover object-center">
        </div>
        }

        <!-- Layer 2: Soft Readability Overlay -->
        <div class="absolute inset-0 bg-[var(--text-taupe)]/10 z-10 pointer-events-none"></div>

        <!-- Layer 3: Magical Slider Dots -->
        <div
            class="absolute bottom-4 sm:bottom-6 left-1/2 -translate-x-1/2 z-30 flex justify-center items-center gap-2 sm:gap-3 bg-[var(--text-taupe)]/15 backdrop-blur-md px-4 sm:px-6 py-2 sm:py-3 rounded-full border border-[var(--surface-white)]/20 shadow-lg">
            @for (img of sliderImages; track img; let idx = $index) {
            <button (click)='setSlide(idx)' title="Go to slide"
                class="h-1.5 sm:h-2 rounded-full transition-all duration-500 cursor-pointer shadow-sm hover:scale-110"
                [style.width]="idx === currentIndex ? '1.5rem' : '0.4rem'"
                [style.backgroundColor]="idx === currentIndex ? 'var(--surface-white)' : 'rgba(255, 255, 255, 0.6)'">
            </button>
            }
        </div>
    </section>

</div>
